name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built where the oldest still supported glibc is, so the executable runs on
          # the distributions people have rather than only on the newest.
          #
          # The runners have no sound device. macOS and Windows are given one so the
          # executable plays through the backend people will use there; Linux keeps
          # the clock-paced null backend, which needs none.
          - { os: ubuntu-22.04, name: Linux, binary: target/paula, output: 'null', backend: 'Null' }
          - { os: macos-latest, name: macOS, binary: target/paula, output: coreaudio, backend: Core Audio }
          - { os: windows-latest, name: Windows, binary: target/paula.exe, output: wasapi, backend: WASAPI }
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Register the GraalVM toolchain
        shell: bash
        run: .github/toolchains.sh

      - name: Build, test and make the executable
        run: mvn -B -ntp package

      - name: List the sound devices
        if: runner.os == 'macOS'
        run: system_profiler SPAudioDataType

      - name: Give the runner a sound device
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/sound-device.ps1
        timeout-minutes: 5

      - name: Run what was built
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" formats
          java -jar target/paula-*-all.jar --version

      - name: Play through ${{ matrix.backend }} and check the sound
        shell: bash
        run: .github/prove-sound.sh "${{ matrix.binary }}" "${{ matrix.output }}" "${{ matrix.backend }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: played-on-${{ matrix.name }}
          path: |
            played.wav
            paula.log
          if-no-files-found: ignore
