name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built where the oldest still supported glibc is, so the executable runs on
          # the distributions people have rather than only on the newest.
          - { os: ubuntu-22.04, name: Linux, binary: target/paula }
          - { os: macos-latest, name: macOS, binary: target/paula }
          - { os: windows-latest, name: Windows, binary: target/paula.exe }
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Register the GraalVM toolchain
        shell: bash
        run: .github/toolchains.sh

      - name: Build, test and make the executable
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp package 2>&1 | tee build.log

      - name: Show the build output
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
        run: |
          [ -f build.log ] || exit 0
          tail -200 build.log
          {
            echo "## $NAME"
            echo '```'
            tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the log where it can be read
        if: failure()
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          branch="ci-log-$NAME"
          git config user.name 'Build'
          git config user.email 'build@adeptum.se'
          git checkout --orphan "$branch"
          git rm -rq --cached . || true
          mkdir -p ci-logs
          cp build.log "ci-logs/$NAME.log"
          git add -f "ci-logs/$NAME.log"
          git commit -qm "What the build said on $NAME"
          git push -f origin "$branch"

      - name: Run what was built
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" formats
          java -jar target/paula-*-all.jar --version
